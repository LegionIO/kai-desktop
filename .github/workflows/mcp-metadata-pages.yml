name: MCP OAuth metadata

on:
  pull_request:
    paths: ['site/**', 'scripts/validate-mcp-metadata.mjs', '.github/workflows/mcp-metadata-pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'scripts/validate-mcp-metadata.mjs', '.github/workflows/mcp-metadata-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-metadata-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-mcp-metadata.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-mcp-metadata.mjs --live
